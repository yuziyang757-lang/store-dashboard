<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.6;
    padding: 16px;
  }
  .dashboard { max-width: 800px; margin: 0 auto; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .header-top h1 { font-size: 18px; font-weight: 700; }
  .header-top h1 span { color: #4fc3f7; }
  .header-top .date { font-size: 13px; color: rgba(255,255,255,.7); text-align: right; }
  .header-store {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-store .store-name { font-size: 20px; font-weight: 700; }
  .header-store .store-name small { font-weight: 400; font-size: 14px; color: rgba(255,255,255,.7); }
  .header-store .badge {
    background: rgba(79,195,247,.2);
    border: 1px solid rgba(79,195,247,.4);
    color: #4fc3f7;
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 11px;
    white-space: nowrap;
  }

  /* Score */
  .hero-card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .score-ring {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: conic-gradient(#4fc3f7 0deg 306deg, #e8eaf6 306deg 360deg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .score-ring-inner {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-ring-inner .num { font-size: 30px; font-weight: 800; color: #1a1a2e; line-height: 1; }
  .score-ring-inner .label { font-size: 11px; color: #888; }
  .hero-info { flex: 1; min-width: 160px; }
  .hero-info .trend { font-size: 14px; color: #666; margin-bottom: 8px; }
  .hero-info .trend .up { color: #4caf50; font-weight: 600; }
  .hero-info .trend .down { color: #f44336; font-weight: 600; }
  .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hero-tags .tag {
    background: #e3f2fd; color: #1565c0;
    padding: 3px 10px; border-radius: 10px; font-size: 11px;
  }
  .hero-tags .tag.warn { background: #fff3e0; color: #e65100; }
  .hero-tags .tag.success { background: #e8f5e9; color: #2e7d32; }

  /* Metrics */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 500px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
  }
  .metric-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    text-align: center;
  }
  .metric-card .m-icon { font-size: 20px; }
  .metric-card .m-label { font-size: 11px; color: #888; margin: 2px 0; }
  .metric-card .m-value { font-size: 20px; font-weight: 700; color: #1a1a2e; }
  .metric-card .m-change { font-size: 11px; }
  .metric-card .m-change.up { color: #4caf50; }
  .metric-card .m-change.down { color: #f44336; }

  /* Cards */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f2f5;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Findings */
  .findings { list-style: none; }
  .findings li { padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
  .findings li:last-child { border-bottom: none; }
  .findings .finding-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .findings .finding-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    background: #1a1a2e; color: #fff;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .findings .finding-source { font-weight: 600; color: #0f3460; font-size: 13px; }
  .findings .finding-data { color: #333; font-size: 13px; margin-bottom: 4px; }
  .findings .finding-suggest {
    font-size: 12px;
    color: #1565c0;
    padding-left: 26px;
  }
  .findings .finding-suggest::before { content: "💡 "; }

  /* Advice */
  .advice-card { background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%); border-left: 4px solid #4fc3f7; }
  .advice-item {
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .advice-item:last-child { margin-bottom: 0; }
  .advice-item .advice-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .advice-item .advice-desc { font-size: 13px; color: #555; }
  .advice-item .advice-pred {
    font-size: 12px;
    color: #4caf50;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed #e0e0e0;
  }

  /* Competitors */
  .competitor {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f5f5f5;
  }
  .competitor:last-child { border-bottom: none; }
  .competitor .c-name { font-weight: 600; min-width: 50px; font-size: 13px; }
  .competitor .c-action { flex: 1; font-size: 13px; color: #333; }
  .competitor .c-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: #e8f5e9;
    color: #2e7d32;
    flex-shrink: 0;
  }
  .competitor .c-tag.warn { background: #fff3e0; color: #e65100; }

  /* ===== 建议追踪 ===== */
  .advice-track { width: 100%; border-collapse: collapse; font-size: 12px; }
  .advice-track th { text-align: left; padding: 6px; font-weight: 600; color: #555; border-bottom: 2px solid #e8eaf6; font-size: 11px; }
  .advice-track td { padding: 8px 6px; border-bottom: 1px solid #f0f2f5; font-size: 12px; }
  .advice-track .status-done { color: #4caf50; font-weight: 600; }
  .advice-track .status-pending { color: #ff9800; font-weight: 600; }
  .advice-track .status-skip { color: #999; }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-top: 24px;
    padding: 12px 0;
  }
  .footer .ai-badge {
    display: inline-block;
    background: #1a1a2e;
    color: #fff;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 9px;
    margin-right: 4px;
  }

  /* Store selector for user (if multiple stores shared on same device) */
  .store-selector {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 12px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .store-selector::-webkit-scrollbar { display: none; }
  .store-selector button {
    padding: 6px 16px;
    border: 1.5px solid #ddd;
    background: #fff;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
    flex-shrink: 0;
  }
  .store-selector button.active {
    border-color: #0f3460;
    background: #0f3460;
    color: #fff;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .advice-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      // 填充默认值（如果管理员还没配置）
      for (const key of Object.keys(DEFAULT_DATA)) {
        if (!data[key]) data[key] = JSON.parse(JSON.stringify(DEFAULT_DATA[key]));
      }
      return data;
    } catch(e) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

// 从 GitHub 拉取最新数据（公开读取，无需 Token）
async function loadFromGitHub() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/yuziyang757-lang/store-dashboard/main/data/store-data.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    for (const key of Object.keys(DEFAULT_DATA)) {
      if (!data[key]) data[key] = JSON.parse(JSON.stringify(DEFAULT_DATA[key]));
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return data;
  } catch(e) {
    console.log('从云端拉取数据失败，使用本地数据:', e.message);
    return null;
  }
}

// ============================================================
//  获取 URL 参数
// ============================================================
function getUrlParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

// ============================================================
//  渲染
// ============================================================
function renderDashboard(storeKey, data) {
  const d = data[storeKey];
  if (!d) return;

  document.getElementById('storeName').innerHTML = `${d.name} <small>· ${d.branch || ''}</small>`;
  document.getElementById('scoreNum').textContent = d.score;
  document.getElementById('revenue').textContent = '¥' + Number(d.revenue).toLocaleString();
  document.getElementById('revenueYoY').textContent = d.revenueYoY || '-';
  document.getElementById('revenueMoM').textContent = d.revenueMoM || '-';
  document.getElementById('revenueYoY').className = (d.revenueYoY || '').startsWith('+') ? 'up' : 'down';
  document.getElementById('revenueMoM').className = (d.revenueMoM || '').startsWith('+') ? 'up' : 'down';

  document.getElementById('heroTags').innerHTML = (d.tags || []).map(t =>
    `<span class="tag${t.cls ? ' ' + t.cls : ''}">${t.text}</span>`
  ).join('');

  document.getElementById('mTraffic').textContent = d.traffic;
  document.getElementById('mTrafficChg').textContent = (d.trafficChg || '').startsWith('+') ? '↑ ' + d.trafficChg : '↓ ' + d.trafficChg;
  document.getElementById('mTicket').textContent = '¥' + d.ticket;
  document.getElementById('mTicketChg').textContent = (d.ticketChg || '').startsWith('+') ? '↑ ' + d.ticketChg : '↓ ' + d.ticketChg;
  document.getElementById('mSocial').textContent = d.social;
  document.getElementById('mSocialChg').textContent = (d.socialChg || '').startsWith('+') ? '↑ ' + d.socialChg : '↓ ' + d.socialChg;
  document.getElementById('mRating').textContent = d.rating;
  const rc = d.ratingChg || '';
  document.getElementById('mRatingChg').textContent = rc.startsWith('-') ? '↓ ' + rc : '↑ ' + rc;
  document.getElementById('mDelivery').textContent = d.delivery;
  document.getElementById('mDeliveryChg').textContent = (d.deliveryChg || '').startsWith('+') ? '↑ ' + d.deliveryChg : '↓ ' + d.deliveryChg;
  document.getElementById('mRepeat').textContent = d.repeat;
  document.getElementById('mRepeatChg').textContent = (d.repeatChg || '').startsWith('+') ? '↑ ' + d.repeatChg : '↓ ' + d.repeatChg;

  document.getElementById('findings').innerHTML = (d.findings || []).map((f, i) =>
    `<li><div class="finding-header"><span class="finding-num">${i + 1}</span><span class="finding-source">${f.source}</span></div><div class="finding-data">${f.data}</div><div class="finding-suggest">${f.suggest}</div></li>`
  ).join('');

  document.getElementById('adviceList').innerHTML = (d.advice || []).map(a =>
    `<div class="advice-item"><div class="advice-title">${a.title}</div><div class="advice-desc">${a.desc}</div><div class="advice-pred">📊 ${a.pred}</div></div>`
  ).join('');

  document.getElementById('competitors').innerHTML = (d.competitors || []).map(c =>
    `<div class="competitor"><span class="c-name">${c.name}</span><span class="c-action">${c.action}</span><span class="c-tag${c.tagCls ? ' ' + c.tagCls : ''}">${c.tag}</span></div>`
  ).join('');

  // 建议追踪
  const history = d.adviceHistory || [];
  const trackCard = document.getElementById('adviceTrackCard');
  const trackBody = document.getElementById('adviceTrackBody');

  if (!history || history.length === 0) {
    trackCard.style.display = 'none';
    return;
  }

  trackCard.style.display = 'block';
  const recent = history.slice(-7);

  let totalDone = 0, totalAdvice = 0;
  recent.forEach(day => {
    (day.advice || []).forEach(a => {
      totalAdvice++;
      if (a.executed === 'done') totalDone++;
    });
  });
  const execRate = totalAdvice > 0 ? Math.round(totalDone / totalAdvice * 100) : 0;

  let html = `<table class="advice-track">
    <tr><th>日期</th><th>建议</th><th>执行</th><th>效果</th></tr>`;

  recent.reverse().forEach(day => {
    const dateStr = day.date || '未知';
    const advices = day.advice || [];
    advices.forEach((a, i) => {
      const statusText = a.executed === 'done' ? '✅ 已执行' : a.executed === 'skip' ? '⏭ 跳过' : '⏳ 待执行';
      const statusClass = a.executed === 'done' ? 'status-done' : a.executed === 'skip' ? 'status-skip' : 'status-pending';
      html += `<tr>
        ${i === 0 ? `<td rowspan="${advices.length}" style="white-space:nowrap;font-weight:600;">${dateStr}</td>` : ''}
        <td>${a.title}</td>
        <td class="${statusClass}">${statusText}</td>
        <td>${a.result || '—'}</td>
      </tr>`;
    });
  });

  html += `</table>
    <div class="advice-summary">
      <div class="stat"><span class="num">${totalAdvice}</span><span class="label">条建议</span></div>
      <div class="stat"><span class="num">${execRate}%</span><span class="label">执行率</span></div>
    </div>`;

  trackBody.innerHTML = html;
}

// ============================================================
//  门店选择器（只读模式）
// ============================================================
function renderStoreSelector(data, currentKey) {
  const container = document.getElementById('storeSelector');
  const keys = Object.keys(data);
  if (keys.length <= 1) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  container.innerHTML = '';
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.textContent = data[key].name;
    btn.dataset.store = key;
    if (key === currentKey) btn.classList.add('active');
    btn.addEventListener('click', function() {
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      renderDashboard(this.dataset.store, data);
      // 更新 URL 参数（不刷新页面）
      const url = new URL(window.location);
      url.searchParams.set('store', this.dataset.store);
      window.history.replaceState({}, '', url);
    });
    container.appendChild(btn);
  });
}

// ============================================================
//  初始化
// ============================================================
(async function init() {
  // 先尝试从 GitHub 拉取最新数据
  let data = loadData();
  const cloudData = await loadFromGitHub();
  if (cloudData) data = cloudData;

  // URL 指定门店，不传参数则不显示任何门店
  const storeParam = getUrlParam('store');

  document.getElementById('currentDate').textContent =
    new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  if (!storeParam || !data[storeParam]) {
    // 无有效门店参数，显示提示信息
    document.getElementById('app').innerHTML = `
      <div style="text-align:center;padding:80px 20px;color:#888;">
        <div style="font-size:64px;margin-bottom:20px;">🔗</div>
        <h2 style="font-size:20px;color:#333;margin-bottom:12px;">请通过老板发送的链接访问</h2>
        <p style="font-size:14px;">每家门店有专属的查看链接，请联系门店管理员获取。</p>
      </div>
    `;
  } else {
    renderDashboard(storeParam, data);
  }
})();
</script>
